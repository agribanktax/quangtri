<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đổi Mật Khẩu Cán Bộ</title>
    <style>
        body {
            background: linear-gradient(135deg, #f1f5f9 0%, #cbd5e1 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
        }
        .card {
            max-width: 400px;
            width: 100%;
            background: #ffffff;
            padding: 30px 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(30, 41, 59, 0.1);
        }
        h2 {
            text-align: center;
            color: #1e293b;
            margin-bottom: 20px;
            font-size: 20px;
            text-transform: uppercase;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 600;
            color: #475569;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }
        .form-group input[readonly] {
            background-color: #e2e8f0;
            color: #64748b;
            cursor: not-allowed;
            border-color: #cbd5e1;
        }
        .form-group input:focus:not([readonly]) {
            border-color: #4f46e5;
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background: #4338ca;
        }
        .btn-back {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #64748b;
            font-size: 13px;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>🔒 Đổi Mật Khẩu</h2>
    
    <div class="form-group">
        <label>👤 Tài khoản cán bộ:</label>
        <input type="text" id="txtUsername" readonly>
    </div>
    
    <div class="form-group">
        <label>🔑 Mật khẩu hiện tại:</label>
        <input type="password" id="txtOldPass" placeholder="Nhập mật khẩu cũ...">
    </div>
    
    <div class="form-group">
        <label>🆕 Mật khẩu mới:</label>
        <input type="password" id="txtNewPass" placeholder="Tối thiểu 6 ký tự...">
    </div>
    
    <div class="form-group">
        <label>🔄 Xác nhận mật khẩu mới:</label>
        <input type="password" id="txtConfirmPass" placeholder="Nhập lại mật khẩu mới...">
    </div>
    
    <button class="btn-submit" onclick="executeChangePassword()">Xác nhận đổi mật khẩu</button>
    <a href="index.html" class="btn-back">⬅ Quay lại hệ thống</a>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAOSKLNPXp-s40iJNYYzdEWDnQDFoa6x_Q",
        authDomain: "thue2026-f558d.firebaseapp.com",
        databaseURL: "https://thue2026-f558d-default-rtdb.firebaseio.com",
        projectId: "thue2026-f558d",
        storageBucket: "thue2026-f558d.firebasestorage.app",
        messagingSenderId: "1008017359572",
        appId: "1:1008017359572:web:f70cf40778e600e8deb141"
    };
    
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    // Tự động điền username từ trang chính khi mở trang
    window.onload = function() {
        const savedUsername = sessionStorage.getItem('changePassUsername');
        if (savedUsername) {
            document.getElementById('txtUsername').value = savedUsername;
        } else {
            alert("Không tìm thấy thông tin phiên làm việc. Vui lòng đăng nhập lại!");
            window.location.href = "index.html";
        }
    };

    function executeChangePassword() {
        const username = document.getElementById('txtUsername').value.trim();
        const oldPass = document.getElementById('txtOldPass').value.trim();
        const newPass = document.getElementById('txtNewPass').value.trim();
        const confirmPass = document.getElementById('txtConfirmPass').value.trim();

        if (!oldPass || !newPass || !confirmPass) {
            alert("Vui lòng điền đầy đủ thông tin vào tất cả các ô!");
            return;
        }

        if (newPass !== confirmPass) {
            alert("Xác nhận mật khẩu mới không trùng khớp!");
            return;
        }

        if (newPass.length < 6) {
            alert("Mật khẩu mới phải từ 6 ký tự trở lên!");
            return;
        }

        // THAY ĐỔI QUAN TRỌNG: Lọc danh sách users tìm bản ghi có trường 'username' bằng giá trị cần tìm
        db.ref('users').orderByChild('username').equalTo(username).once('value').then((snapshot) => {
            if (snapshot.exists()) {
                let userKey = null;
                let userData = null;

                // Vì kết quả trả về là một danh sách các node thỏa mãn (mặc dù chỉ có 1), ta cần dùng vòng lặp để lấy ra
                snapshot.forEach((childSnapshot) => {
                    userKey = childSnapshot.key; // Đây chính là ID của tài khoản (id_key) trên Firebase
                    userData = childSnapshot.val();
                });

                // Ép kiểu String tuyệt đối để so sánh chính xác (mật khẩu số hay chữ đều nhận diện được)
                const dbPasswordStr = String(userData.password).trim();
                const inputPasswordStr = String(oldPass).trim();

                if (dbPasswordStr === inputPasswordStr) {
                    // Tiến hành cập nhật mật khẩu mới trực tiếp vào ID vừa tìm được (userKey)
                    db.ref('users/' + userKey).update({
                        password: String(newPass)
                    }).then(() => {
                        alert("Đổi mật khẩu thành công! Hệ thống sẽ chuyển về trang đăng nhập.");
                        sessionStorage.clear(); // Xóa sạch phiên làm việc cũ để bảo mật
                        window.location.href = "index.html";
                    }).catch(err => {
                        alert("Lỗi cập nhật mật khẩu: " + err.message);
                    });
                } else {
                    alert("Mật khẩu hiện tại không chính xác!");
                }
            } else {
                alert("Không tìm thấy tài khoản cán bộ này trên cơ sở dữ liệu!");
            }
        }).catch(err => {
            alert("Lỗi kết nối database: " + err.message);
        });
    }
</script>
</body>
</html>
